services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DEBUG: "false"
      COOKIES_SECURE: "false"
      SECRET_KEY: solo-para-docker-local-no-usar-en-produccion
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://gastos:gastos@db:5432/gastos
    # Migra, deja la cuenta demo lista y levanta gunicorn.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
