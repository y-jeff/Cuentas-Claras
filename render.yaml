# Blueprint de Render: API Django + Postgres de Cuentas Claras.
# Render → New → Blueprint → este repo.
services:
  - type: web
    name: cuentas-claras-api
    runtime: docker
    rootDir: backend
    # starter no se suspende; free sirve para probar, pero tarda ~50 s en despertar.
    plan: starter
    healthCheckPath: /api/docs
    # seed solo reinicia la cuenta demo; no toca a los demás usuarios.
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py seed &&
      gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --access-logfile -"
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cuentas-claras-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: cuentas-claras-api.onrender.com
      # El frontend hace de proxy, así que su origen debe estar aquí. El de la API es para /admin/.
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cuentasclaras.3rlabs.cl,https://cuentas-claras-api.onrender.com

databases:
  - name: cuentas-claras-db
    databaseName: cuentas_claras
    user: cuentas_claras
    # El plan free expira a los 30 días: para uso real se necesita uno pagado.
    plan: basic-256mb
