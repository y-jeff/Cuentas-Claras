# Producción en el servidor de 3R Labs: solo la API. El frontend corre en Vercel.
#   cp .env.prod.example .env   # y completa SECRET_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
# El puerto queda solo en 127.0.0.1: el único acceso público es el túnel de Cloudflare.
name: cuentas-claras

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      # localhost sirve para probar y para el healthcheck desde el propio servidor.
      ALLOWED_HOSTS: ${API_DOMAIN:-api-cuentasclaras.3rlabs.cl},localhost,127.0.0.1
      # El frontend (Vercel) reenvía las requests del navegador, así que llega su Origin. El de la API es para /admin/.
      CSRF_TRUSTED_ORIGINS: https://${WEB_DOMAIN:-cuentasclaras.3rlabs.cl},https://${API_DOMAIN:-api-cuentasclaras.3rlabs.cl}
      # SQLite en ./data del servidor: un solo archivo, fácil de respaldar.
      DATABASE_URL: sqlite:////data/db.sqlite3
    # seed solo reinicia la cuenta demo; no toca a los demás usuarios.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 1 --threads 4 --access-logfile -"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
