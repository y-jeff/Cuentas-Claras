# Producción en el servidor de 3R Labs, detrás de un túnel de Cloudflare.
#   cp .env.prod.example .env   # y completa los valores
#   docker compose -f docker-compose.prod.yml up -d --build
# Los puertos quedan solo en 127.0.0.1: el único acceso público es el túnel.
name: cuentas-claras

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuentas_claras
      POSTGRES_USER: cuentas_claras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas_claras -d cuentas_claras"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      # "backend" es el Host que llega desde el proxy de Next; localhost sirve para probar desde el servidor.
      ALLOWED_HOSTS: ${API_DOMAIN:-api.cuentasclaras.3rlabs.cl},backend,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${WEB_DOMAIN:-cuentasclaras.3rlabs.cl},https://${API_DOMAIN:-api.cuentasclaras.3rlabs.cl}
      DATABASE_URL: postgres://cuentas_claras:${POSTGRES_PASSWORD}@db:5432/cuentas_claras
    # seed solo reinicia la cuenta demo; no toca a los demás usuarios.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
